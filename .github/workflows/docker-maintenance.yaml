name: Docker Maintenance

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to true to only list images without deleting"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "0 3 * * 0"

jobs:
  cleanup-docker-images:
    name: List and clean unused Docker images
    runs-on: ubuntu-24.04
    steps:
      - name: SSH and run Docker maintenance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

            echo "Docker containers currently running"
            sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            echo

            echo "All Docker images before cleanup"
            sudo docker image ls -a --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}'
            echo

            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run enabled. Skipping deletion."
              exit 0
            fi

            echo "Removing Docker images not used by any container"
            sudo docker image prune -a -f
            echo

            echo "All Docker images after cleanup"
            sudo docker image ls -a --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}'
